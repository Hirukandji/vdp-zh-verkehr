name: Update traffic data

on:
  schedule:
    # Stündlicher Basis-Abruf ALLER 358 Messstellen (nicht mehr alle 15 Min) —
    # das hält die Anzahl Requests an VDP-ZH niedrig. Echtzeitwerte für eine
    # einzelne, gerade angeklickte Messstelle holt sich das Frontend direkt
    # und nur bei Bedarf, siehe fetchLiveForStation() in index.html.
    - cron: "0 * * * *"
  workflow_dispatch: {} # erlaubt manuelles Auslösen über die GitHub-UI

permissions:
  contents: write # nötig, damit der Job latest.json zurück ins Repo committen darf

concurrency:
  group: update-traffic-data
  cancel-in-progress: false # laufenden Commit nicht abbrechen, nächsten Lauf lieber überspringen

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 358 Einzel-Requests nacheinander brauchen ein paar Minuten
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: VDP-ZH abfragen (alle Messstellen), Ergebnis speichern
        run: python join_traffic_data.py

      - name: latest.json committen, falls sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --staged --quiet || git commit -m "Verkehrsdaten aktualisiert $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
